name: Notify Telegram on release (all formats)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send release notice to Telegram (text + media + files)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error

          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT = os.environ["TELEGRAM_CHAT_ID"]
          API = f"https://api.telegram.org/bot{TOKEN}"
          MAX_UPLOAD = 50 * 1024 * 1024      # hosted Bot API: 50 MB per file
          MAX_PHOTO = 10 * 1024 * 1024       # hosted Bot API: 10 MB per photo

          def tg(method, data=None, files=None):
              # files: dict field -> (filename, bytes, mimetype); multipart when present
              import uuid
              if files is None:
                  req = urllib.request.Request(
                      f"{API}/{method}", data=json.dumps(data).encode(),
                      headers={"Content-Type": "application/json"})
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return json.loads(r.read())
              boundary = uuid.uuid4().hex
              body = b""
              for k, v in data.items():
                  body += f"--{boundary}\r\nContent-Disposition: form-data; name=\"{k}\"\r\n\r\n{v}\r\n".encode()
              for field, (fn, blob, mt) in files.items():
                  body += (f"--{boundary}\r\nContent-Disposition: form-data; name=\"{field}\"; "
                           f"filename=\"{fn}\"\r\nContent-Type: {mt}\r\n\r\n").encode() + blob + b"\r\n"
              body += f"--{boundary}--\r\n".encode()
              req = urllib.request.Request(
                  f"{API}/{method}", data=body,
                  headers={"Content-Type": f"multipart/form-data; boundary={boundary}"})
              with urllib.request.urlopen(req, timeout=300) as r:
                  return json.loads(r.read())

          def send_text(text):
              if len(text) > 4096:
                  text = text[:4093] + "…"
              tg("sendMessage", {"chat_id": CHAT, "text": text})

          # 1) Release text (same as v1)
          tag = os.environ.get("RELEASE_TAG", "")
          if tag:
              name = os.environ.get("RELEASE_NAME") or tag
              body = os.environ.get("RELEASE_BODY", "") or ""
              if len(body) > 3000:
                  body = body[:3000] + "……"
              text = (f"新版本发布：{name}\n标签：{tag}\n{body}\n"
                      f"下载：{os.environ['RELEASE_URL']}")
          else:
              text = "Telegram 通知测试：工作流已接通，下次发版会自动推送。"
          send_text(text)
          time.sleep(1.2)
          if not tag:
              raise SystemExit(0)

          # 2) List release assets via GitHub API
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/releases/tags/{tag}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json",
                       "User-Agent": "telegram-release-notify"})
          with urllib.request.urlopen(req, timeout=60) as r:
              assets = json.loads(r.read()).get("assets", [])

          oversize = []
          for a in assets:
              fname, size, url = a["name"], a["size"], a["browser_download_url"]
              if size > MAX_UPLOAD:
                  oversize.append((fname, size, url))
                  continue
              with urllib.request.urlopen(urllib.request.Request(
                      url, headers={"User-Agent": "telegram-release-notify"}),
                      timeout=300) as r:
                  blob = r.read()
              ext = fname.rsplit(".", 1)[-1].lower() if "." in fname else ""
              caption = fname[:1020]
              base = {"chat_id": CHAT, "caption": caption}
              try:
                  if ext in ("png", "jpg", "jpeg", "webp") and size <= MAX_PHOTO:
                      tg("sendPhoto", base, {"photo": (fname, blob, "image/jpeg")})
                  elif ext in ("mp4", "mov"):
                      tg("sendVideo", dict(base, supports_streaming=True),
                         {"video": (fname, blob, "video/mp4")})
                  elif ext == "gif":
                      tg("sendAnimation", base, {"animation": (fname, blob, "image/gif")})
                  elif ext in ("mp3", "m4a"):
                      tg("sendAudio", base, {"audio": (fname, blob, "audio/mpeg")})
                  else:
                      tg("sendDocument", base, {"document": (fname, blob, "application/octet-stream")})
              except urllib.error.HTTPError as e:
                  send_text(f"附件发送失败：{fname}（{e.code}，请到 Release 页面下载：{url}）")
              time.sleep(1.2)  # private-chat rate limit: ~1 msg/sec

          # 3) Oversize files cannot go through hosted Bot API: link only
          if oversize:
              lines = ["以下附件超过 Bot API 50MB 上限，只能发链接，请到 Release 页面下载："]
              for fname, size, url in oversize:
                  lines.append(f"• {fname}（约 {size // 1048576}MB）{url}")
              send_text("\n".join(lines))
          PY
